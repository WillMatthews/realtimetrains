# https://taskfile.dev

version: '3'

tasks:
  fmt-golines:
    cmds:
      - "golines -w ."

  fmt-golines-check:
    cmds:
      - |
        set -eu
        golines -w .
        if ! git diff --quiet; then
          echo "golines formatting changes detected. Run 'task fmt-golines'."
          git --no-pager diff
          exit 1
        fi

  fmt-gofmt-check:
    cmds:
      - |
        set -eu
        out="$(gofmt -s -l .)"
        if [ -n "$out" ]; then
          echo "gofmt -s found unformatted files:"
          echo "$out"
          exit 1
        fi

  mod-tidy-check:
    cmds:
      - |
        set -eu
        go mod tidy
        if ! git diff --quiet -- go.mod go.sum; then
          echo "go mod tidy would modify go.mod or go.sum. Run 'go mod tidy'."
          git --no-pager diff -- go.mod go.sum
          exit 1
        fi

  vet:
    cmds:
      - "go vet ./..."

  staticcheck:
    cmds:
      - "staticcheck ./..."

  govulncheck:
    cmds:
      - |
        set -euo pipefail
        go list -json -deps ./... | govulncheck

  test-race:
    cmds:
      - "go test -race ./..."

